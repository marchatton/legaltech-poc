services:
  db:
    image: pgvector/pgvector:pg17
    container_name: orbital-demo-prod-db
    environment:
      POSTGRES_DB: orbital
      POSTGRES_USER: orbital
      POSTGRES_PASSWORD: orbital
    # Demo-prod should not publish Postgres to the host by default.
    # If you need local access for debugging, use an override file or
    # temporarily uncomment the loopback-only mapping below:
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - orbital-demo-prod-pgdata:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbital -d orbital"]
      interval: 2s
      timeout: 5s
      retries: 20

  volume-perms:
    image: busybox:1.36
    container_name: orbital-demo-prod-volume-perms
    command:
      [
        "sh",
        "-c",
        "mkdir -p /app/tmp/object-store /app/tmp/fixture-seed && chown -R 1000:1000 /app/tmp/object-store /app/tmp/fixture-seed",
      ]
    volumes:
      - orbital-demo-prod-object-store:/app/tmp/object-store
      - orbital-demo-prod-fixture-seed:/app/tmp/fixture-seed

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: orbital-demo-prod-web
    depends_on:
      db:
        condition: service_healthy
      volume-perms:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      ORBITAL_MODE: demo-prod

      # Required in demo-prod (fail closed if missing).
      DATABASE_URL: postgresql://orbital:orbital@db:5432/orbital
      OBJECT_STORE_SIGNING_SECRET: ${OBJECT_STORE_SIGNING_SECRET:?required}

      # Basic Auth for private demo.
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?required}
      BASIC_AUTH_PASS: ${BASIC_AUTH_PASS:?required}

      # Feature flags for the demo journey.
      FEATURE_ARTEFACTS_LIST: "1"

    ports:
      - "3000:3000"
    volumes:
      - orbital-demo-prod-object-store:/app/tmp/object-store
      - orbital-demo-prod-fixture-seed:/app/tmp/fixture-seed

  worker:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: orbital-demo-prod-worker
    depends_on:
      db:
        condition: service_healthy
      volume-perms:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      ORBITAL_MODE: demo-prod
      DATABASE_URL: postgresql://orbital:orbital@db:5432/orbital
      OBJECT_STORE_SIGNING_SECRET: ${OBJECT_STORE_SIGNING_SECRET:?required}
    command: ["pnpm", "worker"]
    volumes:
      - orbital-demo-prod-object-store:/app/tmp/object-store
      - orbital-demo-prod-fixture-seed:/app/tmp/fixture-seed

volumes:
  orbital-demo-prod-pgdata:
  orbital-demo-prod-object-store:
  orbital-demo-prod-fixture-seed:
